# Commentary: from the fact sheets only (cricsense.commentary.facts).
engine: auto            # auto: the LLM when an API key is found, else templates | llm | template

llm:                    # keys come from the environment or the gitignored .env, never from here
  # Gemini API free tier: a key from https://aistudio.google.com/apikey as GEMINI_API_KEY in .env.
  # Free-tier prompts may be used by Google to improve its products; about 10 requests a minute.
  provider: gemini      # anthropic | gemini | openai (any OpenAI-compatible endpoint: set base_url)
  model: gemini-3.5-flash-lite
  style: lively, warm, broadcast TV; varied phrasing; short sentences that read well aloud
  # Any OpenAI-compatible endpoint instead: provider openai, base_url, key_env, model - e.g.
  #   Groq        base_url https://api.groq.com/openai/v1   key_env GROQ_API_KEY
  #   OpenRouter  base_url https://openrouter.ai/api/v1     key_env OPENROUTER_API_KEY  (":free" models)
  #   Lightning   base_url https://lightning.ai/api/v1      key_env LIGHTNING_API_KEY

vlm:                    # shot type and direction from frames around bat contact
  # Off: no free model read shots reliably (2026-10-21, docs/decisions.md). Gemini Flash-Lite called
  # three different swings "cover drive"; Groq's qwen3.8-27b read Marsh's sweep as a flick and
  # agreed with itself on 3 of 9 shots; gemini-3.6-flash allows 20 requests a day (one over).
  enabled: false
  provider: openai      # to try it again: enabled true (Groq: a free GROQ_API_KEY in .env)
  base_url: https://api.groq.com/openai/v1
  key_env: GROQ_API_KEY
  model: qwen/qwen3.8-27b
  max_images: 3         # Groq takes at most 3 images per request: the 4 frames go as one 2x2 picture
  timeout_s: 120        # its free tier allows ~3 image calls a minute: about a minute per shot

max_words:              # caps; the time before the next ball can make them smaller
  ball: 22
  after: 24

tts:                    # spoken commentary (cricsense voice)
  engine: kokoro        # kokoro: local, free, no key (~90 MB model, ~0.4 GB memory) | gemini: needs GEMINI_API_KEY
  model: models/tts/kokoro-v1.0.int8.onnx
  voices: models/tts/voices-v1.0.bin
  voice: bm_george      # a British male voice; others: bm_lewis, bm_daniel, am_michael
  # gemini: engine gemini, model gemini-3.8-flash-tts, voice Sadaltager
  # f5 (a cloned voice - only someone who agreed): engine f5, plus
  #   ref_audio: voices/<name>.wav     # 8-15 s of clean speech; voices/ is not committed
  #   ref_text: "exactly the words said in that recording"
