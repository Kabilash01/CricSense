# Paths are relative to the repo root. Nothing in src/ hardcodes a path.
device: cuda:0

paths:
  player_weights: models/yolov8m_production4.pt
  ball_weights: models/ball_best.pt  # YOLOv8l @1280 (ball-tracking repo, ball_test/weights/best.pt)
  video_dir: data
  output_dir: outputs
  calibration_dir: configs/calibration

video:
  # null keeps native resolution. Calibration is done in the same coordinates the passes use,
  # so changing this after calibrating invalidates configs/calibration/<video_id>.yaml.
  resize: null

# Carrying the calibration from its reference frame to every other frame.
# The broadcast camera pans and zooms through each delivery (measured: up to ~260 px and
# ~30% zoom within 2 s), so a single homography per video is not enough.
camera:
  match_scale: 1.0        # < 1 finds features on a downscaled copy: faster, less precise
  orb_features: 3000
  ransac_px: 3.0          # RANSAC inlier threshold, in pixels of the (downscaled) frame
  min_inliers: 80         # below this a frame is treated as not showing a calibrated view
  max_chain_frames: 25    # frames tracked via the previous frame before a direct match is required
  # Skip feature matching on frames with almost no pitch-coloured ground (crowd, close-ups,
  # graphics): same frames calibrated on the dev clip, 1.4x faster. 0 turns it off (a very
  # green pitch elsewhere could fail a colour test). Half-resolution matching was also
  # measured: 1.9x faster but corner error 1.8 -> 3.1 px median, 63 px p95 - rejected.
  gate_min_pitch: 0.03
  # Per-frame estimates jitter by several px (0.5-1 m on the pitch) while the camera moves
  # smoothly: outliers vs the local median are replaced, then a Savitzky-Golay filter runs.
  smooth_window: 11       # frames (odd)
  outlier_px: 6.0         # crease-corner disagreement with neighbours that marks a bad frame
  # Broadcast graphics stay fixed on screen while the camera moves; matching on them would
  # drag the estimate toward "no motion". Rectangles as [x0, y0, x1, y1] fractions of the frame.
  overlay_mask:
    - [0.0, 0.0, 0.14, 0.23]   # tournament logo incl. the "FINAL 2024" text, top left
    - [0.0, 0.85, 1.0, 1.0]    # score bar
