[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricsense"
version = "0.1.0"
description = "Cricket video analysis: player identity and roles, ball line and length, fused event timeline."
readme = "README.md"
requires-python = ">=3.10"
# Core deps only: enough for config, schema, video I/O, calibration and the CPU passes.
# GPU passes need the [ml] extra (torch + ultralytics); see requirements.txt.
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
ml = ["torch>=2.7", "ultralytics>=8.4", "lap>=0.5", "onnxruntime>=1.20"]
ocr = ["easyocr>=1.7", "pytesseract>=0.3.10"]
render = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
cricsense = "cricsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
