[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricsense"
version = "0.1.0"
description = "Cricket video analysis: player identity and roles, ball line and length, fused event timeline."
readme = "README.md"
requires-python = ">=3.10"
# Core deps only: enough for config, schema, video I/O, calibration and the CPU passes.
# GPU passes need the [ml] extra (torch + ultralytics); see requirements.txt.
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
ml = ["torch>=2.7", "ultralytics>=8.4", "lap>=0.5", "onnxruntime>=1.20"]
ocr = ["easyocr>=1.7", "pytesseract>=0.3.10"]
render = ["matplotlib>=3.8", "pillow>=10"]
commentary = ["requests>=2.31"]
voice = ["kokoro-onnx>=0.6", "soundfile>=0.12"]
store = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
clean-audio = ["demucs>=4.0"]  # broadcast_voices: remove - the broadcast's commentators out from under ours
clone-voice = ["f5-tts>=1.1"]  # tts.engine f5; installs torchaudio 2.11 beside torch 2.14 (works; see RUNBOOK)
s3 = ["boto3>=1.34"]  # only for object storage on S3 (configs/store.yaml); local files need nothing
roboflow = ["roboflow>=1.1"]  # only for prepare_ball_labelling.py --upload; the local labeller needs nothing
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
cricsense = "cricsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
